name: bulario-service

services:
  app:
    build:
      context: .
    environment:
      APP_ENV: local
      DATABASE_URL: ${BULARIO_DOCKER_DATABASE_URL:-postgresql://intelireg:intelireg_local@db:5432/intelireg}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - intelireg

networks:
  intelireg:
    external: true
    name: ${INTELIREG_DOCKER_NETWORK:-intelireg-local_default}
