[project]
name = "bulario-service"
version = "0.1.0"
description = "Serviço produtor de dados e documentos de bulas para o ecossistema InteliReg."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulario_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]