[project]
name = "bulario-service"
version = "0.1.0"
description = "Serviço produtor de dados e documentos de bulas para o ecossistema InteliReg."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "httpx>=0.28,<1",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulario_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
